name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/jordan-lake-registry
  IMAGE: jordan-lake-scraper
  CLUSTER_ID: aba3181e-8e89-4b3b-9cfe-46acc7dc2f44
  DEPLOYMENT: jordan-lake-scraper

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_ID }} --expiry-seconds 600

      - name: Apply manifests
        run: kubectl apply -f k8s/manifests.yaml

      - name: Roll out new image
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT }} \
            scraper=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/${{ env.DEPLOYMENT }} --timeout=180s

      - name: Show pods
        if: always()
        run: kubectl get pods -l app=${{ env.DEPLOYMENT }} -o wide
