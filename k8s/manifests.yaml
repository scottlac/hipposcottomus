---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jordan-lake-scraper
  labels:
    app: jordan-lake-scraper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jordan-lake-scraper
  template:
    metadata:
      labels:
        app: jordan-lake-scraper
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        # Downloads the MaxMind GeoLite2 City DB to /data/ on pod start.
        # Fails open: if the download fails, the main container still starts
        # and analytics runs without geographic tracking.
        - name: geoip-init
          image: alpine:3.20
          env:
            - name: MAXMIND_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: maxmind-license
                  key: license-key
          volumeMounts:
            - name: data
              mountPath: /data
          command: ["sh", "-c"]
          args:
            - |
              set -u
              apk add --no-cache curl ca-certificates >/dev/null 2>&1
              DB=/data/GeoLite2-City.mmdb
              TARBALL=/tmp/geolite.tar.gz

              # Clean up the old Country DB if it's still on the PVC.
              rm -f /data/GeoLite2-Country.mmdb

              # Skip download if DB exists and is < 3 days old.
              if [ -f "$DB" ] && [ -n "$(find "$DB" -mtime -3 2>/dev/null)" ]; then
                echo "[geoip-init] $DB is fresh; skipping download"
                exit 0
              fi

              echo "[geoip-init] Downloading GeoLite2-City DB from MaxMind..."
              if ! curl -fsSL -o "$TARBALL" \
                "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz"; then
                echo "[geoip-init] WARN: download failed; pod will start without geo tracking"
                exit 0
              fi

              cd /tmp
              if ! tar -xzf "$TARBALL"; then
                echo "[geoip-init] WARN: tar extraction failed; pod will start without geo tracking"
                rm -f "$TARBALL"
                exit 0
              fi

              NEW_DB=$(find /tmp -name 'GeoLite2-City.mmdb' -type f | head -n1)
              if [ -z "$NEW_DB" ]; then
                echo "[geoip-init] WARN: tarball did not contain GeoLite2-City.mmdb"
                rm -rf "$TARBALL" /tmp/GeoLite2-City_*
                exit 0
              fi

              mv "$NEW_DB" "$DB"
              chmod 0644 "$DB"
              rm -rf "$TARBALL" /tmp/GeoLite2-City_*
              echo "[geoip-init] DB updated at $DB ($(stat -c%s "$DB") bytes)"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: scraper
          image: registry.digitalocean.com/jordan-lake-registry/jordan-lake-scraper:latest
          ports:
            - containerPort: 8080
              name: metrics
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jordan-lake-scraper-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jordan-lake-scraper-data
  labels:
    app: jordan-lake-scraper
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jordan-lake-scraper
  labels:
    app: jordan-lake-scraper
spec:
  type: ClusterIP
  selector:
    app: jordan-lake-scraper
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jordan-lake-scraper
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hipposcottomus.com
      secretName: hipposcottomus-tls
  rules:
    - host: hipposcottomus.com
      http:
        paths:
          - path: /lakedashboard
            pathType: Prefix
            backend:
              service:
                name: jordan-lake-scraper
                port:
                  number: 8080
          - path: /gaston
            pathType: Prefix
            backend:
              service:
                name: jordan-lake-scraper
                port:
                  number: 8080
          - path: /ftlauderdale
            pathType: Prefix
            backend:
              service:
                name: jordan-lake-scraper
                port:
                  number: 8080
          - path: /poker
            pathType: Prefix
            backend:
              service:
                name: jordan-lake-scraper
                port:
                  number: 8080
          - path: /astronomy
            pathType: Prefix
            backend:
              service:
                name: jordan-lake-scraper
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: jordan-lake-scraper
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jordan-lake-scraper
                port:
                  number: 8080
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: scott@hipposcottomus.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
