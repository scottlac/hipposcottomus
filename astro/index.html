<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Sky Tonight</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦛</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="hippo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="hipposcottomus">
  <meta property="og:title" content="Night Sky Tonight">
  <meta property="og:description" content="Tonight's sun &amp; twilight times, moon phase and rise/set, plus upcoming visible ISS passes for your location.">
  <meta property="og:url" content="https://hipposcottomus.com/astronomy/">
  <meta property="og:image" content="https://hipposcottomus.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Night Sky Tonight">
  <meta name="twitter:description" content="Sun, moon, twilight, and upcoming ISS passes for your location.">
  <meta name="twitter:image" content="https://hipposcottomus.com/og.png">
  <base href="/astronomy/" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🔭 Night Sky Tonight</h1>
    <div class="location-bar">
      <span id="locLabel" class="location-bar__label">Loading location…</span>
      <button type="button" id="useMyLocation" class="location-bar__button">
        Use my location
      </button>
    </div>
  </header>

  <main>
    <section class="highlight" id="highlight" hidden>
      <div class="highlight__icon" id="highlightIcon">✨</div>
      <div class="highlight__body">
        <div class="highlight__title" id="highlightTitle">—</div>
        <div class="highlight__detail" id="highlightDetail">—</div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel__title">☀️ Sun &amp; Twilight</h2>
      <div class="sun-grid" id="sunGrid">
        <div class="sun-row placeholder">Loading…</div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel__title">🌙 Moon</h2>
      <div class="moon-layout">
        <div class="moon-svg-wrap">
          <svg id="moonSvg" class="moon-svg" viewBox="-60 -60 120 120"
               aria-hidden="true"></svg>
        </div>
        <div class="moon-info" id="moonInfo">
          <div class="moon-info__row placeholder">Loading…</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel__title">🛰️ ISS Passes (next 48h)</h2>
      <div class="passes-wrap">
        <table class="passes" id="passesTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Start</th>
              <th>Peak</th>
              <th>Peak Alt</th>
              <th>Direction</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="passesBody">
            <tr><td colspan="6" class="placeholder">Loading…</td></tr>
          </tbody>
        </table>
        <div id="passesEmpty" class="passes-empty" hidden>
          No good ISS passes in the next 48 hours.
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>
      Computed locally · ISS via
      <a href="https://celestrak.org" target="_blank" rel="noopener">Celestrak</a>
      TLE · sun/moon via Meeus formulas ·
      <a href="/">Home</a>
    </p>
  </footer>

  <script src="app.js"></script>
  <script>
    try {
      navigator.sendBeacon(
        "/analytics/api/screen",
        JSON.stringify({ size: screen.width + "x" + screen.height })
      );
    } catch (e) {}
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("SW registration failed:", e));
      });
    }
  </script>
</body>
</html>
