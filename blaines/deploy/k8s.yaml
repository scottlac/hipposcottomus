# ════════════════════════════════════════════════════════════════════
# Blaine's Barbershop — static site served at https://blaines.shop/
#
# Apply with:  kubectl apply -f deploy/k8s.yaml
#
# Prerequisites on the cluster (already present from the main site):
#   - ingress-nginx (ingressClassName: nginx)
#   - cert-manager with a `letsencrypt-prod` ClusterIssuer
#
# Before this works end to end:
#   - DNS: an A record for blaines.shop pointing at the ingress load
#     balancer IP (same IP the other site's domain resolves to).
#   - The DIGITALOCEAN_ACCESS_TOKEN secret must exist in the repo so CI
#     can push the image and reach the cluster.
# ════════════════════════════════════════════════════════════════════
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blaines-site
  labels:
    app: blaines-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blaines-site
  template:
    metadata:
      labels:
        app: blaines-site
    spec:
      containers:
        - name: web
          # CI pins this to the :<sha> tag on each deploy. blaines-site is
          # its own repository in the DO registry.
          image: registry.digitalocean.com/jordan-lake-registry/blaines-site:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # nginx writes its pid/cache under /tmp in this image
---
apiVersion: v1
kind: Service
metadata:
  name: blaines-site
  labels:
    app: blaines-site
spec:
  selector:
    app: blaines-site
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blaines-site
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - blaines.shop
      secretName: blaines-shop-tls  # cert-manager creates this from the cluster issuer
  rules:
    - host: blaines.shop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blaines-site
                port:
                  number: 8080

# ----------------------------------------------------------------------
# Adding www: create an A record for www.blaines.shop pointing at the same
# load balancer, then add `www.blaines.shop` to both the tls hosts list
# and a second rule above. (Don't add it before the DNS record exists —
# cert-manager's HTTP-01 challenge needs every host in the cert to
# resolve, or issuance fails for all of them.)
