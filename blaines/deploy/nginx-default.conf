# Overrides the nginx-unprivileged image's default server config.
#
# absolute_redirect off is the load-bearing line: without it, nginx builds
# any directory redirect from its own listen port, sending browsers to
# http://blaines.shop:8080/... — a port that isn't exposed publicly, so the
# request times out. A relative Location header keeps the scheme/host/port
# the visitor arrived on.
server {
    listen       8080;
    server_name  _;

    absolute_redirect off;

    root   /usr/share/nginx/html;
    index  index.html;

    # HTML: always revalidate with the server so returning visitors get
    # fresh content immediately after a deploy.
    location / {
        add_header Cache-Control "no-cache";
    }

    # Static assets: cache for a day. index.html references them with
    # ?v=N query strings — bump the version when assets change so
    # previously-cached copies are bypassed right away.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
