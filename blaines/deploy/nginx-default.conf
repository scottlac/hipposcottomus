# Overrides the nginx-unprivileged image's default server config.
#
# absolute_redirect off is the load-bearing line: without it, nginx builds
# directory redirects (/blaines -> /blaines/) from its own listen port,
# sending browsers to http://hipposcottomus.com:8080/blaines/ — a port that
# isn't exposed publicly, so the request times out. A relative Location
# header keeps the scheme/host/port the visitor arrived on.
server {
    listen       8080;
    server_name  _;

    absolute_redirect off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-lived caching for static assets; HTML stays revalidated.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
