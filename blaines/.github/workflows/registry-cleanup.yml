# Frees space in the DO Container Registry.
#
# Every deploy pushes a new :<sha> tag; old ones accumulate. This prunes
# old sha tags (keeping the newest few so a running pod can still re-pull
# its pinned image) and runs garbage collection, which is what actually
# reclaims the space. The registry is read-only while GC runs, so this
# waits for completion rather than racing the next deploy.
name: Registry Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1" # weekly, Mondays 06:37 UTC

env:
  REPO: blaines-site
  KEEP: 3 # newest sha tags to keep

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Prune old sha tags
        run: |
          set -euo pipefail

          # Keep `latest` and the newest $KEEP 40-hex sha tags; delete the rest.
          DOOMED=$(
            doctl registry repository list-tags "$REPO" --format Tag,UpdatedAt --no-header \
              | awk '$1 ~ /^[0-9a-f]{40}$/ { print $2 "T" $3, $1 }' \
              | sort -r \
              | awk -v k="$KEEP" 'NR > k { print $2 }'
          )

          if [ -z "$DOOMED" ]; then
            echo "Nothing to prune."
          else
            echo "Deleting tags:"
            echo "$DOOMED"
            # shellcheck disable=SC2086
            doctl registry repository delete-tag "$REPO" $DOOMED --force
          fi

      - name: Run garbage collection and wait
        run: |
          set -euo pipefail

          doctl registry garbage-collection start --include-untagged-manifests --force

          for i in $(seq 1 60); do
            STATUS=$(doctl registry garbage-collection get-active --format Status --no-header 2>/dev/null || true)
            if [ -z "$STATUS" ]; then
              echo "Garbage collection complete."
              exit 0
            fi
            echo "GC status: $STATUS — waiting..."
            sleep 30
          done
          echo "GC still running after 30 minutes; check the DO console." >&2
          exit 1

      - name: Show registry usage
        if: always()
        continue-on-error: true # informational only
        run: doctl registry get -o json
